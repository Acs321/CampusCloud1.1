name: campuscloud
services:

  sql-server-cloud:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campuscloud-sqlserver
    profiles: [unidad1]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configurar en docker/.env}
    ports:
      - "1434:1433"
    volumes:
      - sql_practica_nueva:/var/opt/mssql
    networks:
      - campuscloud_net

  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    profiles: [unidad1]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salvador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar en docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-campuscloud}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [campuscloud_net]
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: campuscloud-pgadmin
    profiles: [unidad1]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-salvador@example.invalid}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configurar en docker/.env}
    ports: ["${PGADMIN_PORT:-5050}:80"]
    volumes: ["pgadmin_data:/var/lib/pgadmin"]
    networks: [campuscloud_net]
  mongo-cloud:
    image: mongo:8.0
    container_name: campuscloud-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-salvador}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Configurar en docker/.env}
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo_practicas_data:/data/db"]
    networks: [campuscloud_net]
  neo4j-cloud:
    image: neo4j:5-community
    container_name: campuscloud-neo4j-practicas
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Configurar en docker/.env}
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_practicas_data:/data
    networks:
      - campuscloud_net
  cassandra-cloud:
    image: cassandra:5.0
    container_name: campuscloud-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: CampusCloudLocal
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports: ["${CASSANDRA_PORT:-9042}:9042"]
    volumes: ["cassandra_data:/var/lib/cassandra"]
    networks: [campuscloud_net]
volumes:
  sql_data:
  postgres_data:
  pgadmin_data:
  mongo_data:
  mongo_practicas_data:
  neo4j_data:
  neo4j_practicas_data:
  cassandra_data:
  sql_practica_nueva:
networks:
  campuscloud_net:
    driver: bridge